services:
  postgres:
    image: postgres:16-alpine
    container_name: autonomika_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: autonomika
      POSTGRES_PASSWORD: autonomika
      POSTGRES_DB: autonomika
    ports:
      - "5432:5432"
    volumes:
      - bd_data:/var/lib/postgresql/data

  web:
    build: .
    container_name: autonomika_backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      - .:/app
    environment:
      - DATABASE_URL=postgresql+asyncpg://autonomika:autonomika@postgres:5432/autonomika
    depends_on:
      - postgres

volumes:
  bd_data:
